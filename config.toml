# Non-secret settings. Credentials live in .env only.
# Paths are relative to the repo root, or absolute.

[toss]
base_url = "https://openapi.tossinvest.com"
token_cache = ".toss_token.json"
db = "data/toss/orders.sqlite"
tradesviz_csv = "data/toss/tradesviz_executions.csv"
ghostfolio_json = "data/toss/ghostfolio_activities.json"
adjustments = "data/toss/adjustments.toml"   # manual corrections, see brokers/toss/adjustments.py

[ghostfolio]
url = "http://100.104.205.124:3333"   # the address deploy/ghostfolio publishes on

[tradesviz]
sync_dir = ""   # optional: folder the CSV is copied to by daily-sync (e.g. a Google Drive sync folder)
