[project]
name = "systematic-trading"
version = "0.1.0"
description = "Toss Securities Open API integration and trade record management"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
toss-auth = "brokers.toss.auth:main"
toss-backfill-orders = "brokers.toss.backfill_orders:main"
toss-export-tradesviz = "brokers.toss.export_tradesviz:main"
toss-export-ghostfolio = "brokers.toss.export_ghostfolio:main"
toss-export-portfolio = "brokers.toss.export_portfolio:main"
daily-sync = "jobs.daily_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brokers", "ghostfolio", "jobs"]

[tool.ruff]
line-length = 120
extend-exclude = ["trunk"]   # parked work, not part of the build
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF", "SIM"]
