# Ghostfolio (self-hosted portfolio tracker) for ROADMAP §1.2.
# Based on the upstream docker/docker-compose.yml at tag 3.71.0, with:
# - the image pinned to that tag,
# - the web port published only on the address in GHOSTFOLIO_BIND (.env) — the Tailscale IP,
#   so the UI is reachable from the tailnet and nowhere else.
#
#   cp .env.example .env    # then fill in the secrets (openssl rand -hex 32)
#   docker compose up -d
#   docker compose logs -f ghostfolio
#
# Data lives in the named volume ghostfolio_postgres. Backup:
#   docker exec gf-postgres pg_dump -U user ghostfolio-db > ghostfolio.sql
name: ghostfolio
services:
  ghostfolio:
    image: docker.io/ghostfolio/ghostfolio:3.71.0
    container_name: ghostfolio
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - '${GHOSTFOLIO_BIND:-127.0.0.1}:3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3333/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: gf-postgres
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -d "$${POSTGRES_DB}" -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:alpine
    container_name: gf-redis
    restart: unless-stopped
    user: '999:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli --pass "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres:
